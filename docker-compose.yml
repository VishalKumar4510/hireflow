services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hireflow-db
    environment:
      POSTGRES_DB: hireflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hireflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hireflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hireflow_data:
